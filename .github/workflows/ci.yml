name: CI
on: [push, pull_request]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/dima-audit.json || true
          node -e "const a=require('/tmp/dima-audit.json'); console.log(JSON.stringify(a.vulnerabilities || {}, null, 2))"
      - run: npm audit --audit-level=high
      - run: npm run build
